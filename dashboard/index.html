<!-- أنواع التفعيل: الملف الوحيد الذي يعدّله صاحب المتجر. مكانه هنا لا
     في الموقع، لأن اللوحة وحدها تحتاج القائمة — الموقع يقرأ ما هو

<style>
/* ============================================================
   لوحة Janeiro — أداة تشغيل، لا واجهة متجر.
   نفس أسود المتجر وبنفسجه وخطوطه، لكن السطح أكثف: شاشة تُقرأ
   بسرعة ويُضغط فيها، غالباً من الهاتف أثناء تنفيذ طلب.
   ألوان الحالة دلالية ومنفصلة عن لون الهوية.
   ============================================================ */
:root{
  --bg:#09080D; --surface:#121019; --surface-2:#1A1724; --line:#262133; --line-2:#3A3349;
  --ink:#F3F1F8; --ink-2:#CFCADB; --muted:#A8A3B8;
  --accent:#7C3AED; --accent-hover:#6D28D9; --accent-fg:#B9A2FF; --accent-soft:rgba(139,92,246,.15);
  --glow:rgba(124,58,237,.45);
  --wait:#F0AE4A;      /* ينتظرك */
  --work:#5AA9FF;      /* قيد العمل */
  --done:#45D7AC;      /* منتهٍ بخير */
  --dead:#FF7391;      /* ملغى أو مسترجع */
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-synthesis:none}

/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(9,8,13,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
/* the top bar. Do not reuse this class name -- a later .bar rule for
   the chart columns once overrode flex-direction here and stacked it. */
.bar{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;flex:none;display:block;object-fit:contain;filter:drop-shadow(0 0 8px var(--glow))}
.bar h1{font-size:16px;font-weight:700;margin:0;flex:1;white-space:nowrap}
.bar h1 small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-inline-start:6px}
@media(max-width:520px){.bar .who,.bar h1 small{display:none}}
.bar .who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:30vw;white-space:nowrap}
.linkbtn{font-size:13px;color:var(--accent-fg);padding:7px 11px;border-radius:10px;border:1px solid transparent}
.linkbtn:hover{background:var(--accent-soft);border-color:var(--line)}

.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;padding:0 16px}
.side{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow-y:auto;padding:18px 0 40px;
  display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.side .grp{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--muted);margin:16px 12px 6px}
.side .grp:first-child{margin-top:4px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:9px 12px;border-radius:11px;
  font-size:14px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s}
.tab svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.tab:hover{background:var(--surface);color:var(--ink)}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.tab[aria-current="true"] svg{color:var(--accent-fg);opacity:1}
.tab .cnt{margin-inline-start:auto;font-family:var(--f-mono);font-size:11px;min-width:20px;height:20px;padding:0 6px;
  border-radius:999px;background:var(--wait);color:#1A1205;display:grid;place-items:center;font-weight:600}
.wrap{min-width:0;padding:4px 0 72px}
@media(max-width:980px){
  .shell{display:block;padding:0}
  .side{position:sticky;top:57px;z-index:20;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;
    padding:8px 16px;gap:6px;background:rgba(9,8,13,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .grp{display:none}
  .tab{width:auto;flex:none;padding:7px 12px;font-size:13.5px;white-space:nowrap;border:1px solid var(--line)}
  .tab svg{display:none}
  .wrap{padding:4px 16px 72px}
}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 4px}
.pagehead h2{font-size:22px;font-weight:700;margin:0}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;
  border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-2);background:var(--surface);
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chip[aria-pressed="true"] .n{color:#EDE6FF}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  padding:0 40px 0 12px;outline:0}
.search input:focus,.ed input:focus,.ed select:focus,.ed textarea:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);width:17px;height:17px;
  fill:none;stroke:var(--muted);stroke-width:1.9;pointer-events:none}
.toolbar select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}

/* ---------- order rows ---------- */
.rows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  border-inline-start:3px solid var(--tone,var(--muted));transition:border-color .15s,transform .12s}
button.row:hover{border-color:var(--accent)}
button.row:active{transform:scale(.995)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .num{align-self:flex-start;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.row .name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .money{font-family:var(--f-mono);font-size:14px;font-weight:600;flex:none}
.row .side-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:600px){.row.wrapme{flex-wrap:wrap}.row.wrapme .side-acts{width:100%;justify-content:flex-start}}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none;
  color:var(--tone);background:color-mix(in srgb,var(--tone) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--tone) 32%,transparent);white-space:nowrap}
.t-wait{--tone:var(--wait)} .t-work{--tone:var(--work)}
.t-done{--tone:var(--done)} .t-dead{--tone:var(--dead)} .t-muted{--tone:var(--muted)}

.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}
.empty b{display:block;font-family:var(--f-display);color:var(--ink);font-size:16px;margin-bottom:6px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card h2{font-size:15.5px;font-weight:700;margin:0}
.card h3{font-size:14.5px;font-weight:700;margin:0}
.cardhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cardhead h2{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;overflow-wrap:anywhere}
.item{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:9px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item b{font-size:14.5px}
.item .plan{font-size:12.5px;color:var(--muted)}
/* activation data is what you actually need to do the job */
.act{display:grid;gap:7px;background:var(--bg);border:1px dashed var(--line-2);
  border-radius:10px;padding:11px}
.act .r{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;align-items:baseline}
.act .r span{color:var(--muted);flex:none}
.act .r b{font-family:var(--f-mono);font-weight:500;overflow-wrap:anywhere;text-align:end}
@media(max-width:440px){
  .act .r{flex-wrap:wrap;gap:2px 10px}
  .act .r b{width:100%;text-align:start;order:3}
  .act .r .copy{margin-inline-start:auto}
}
.copy{font-size:11.5px;color:var(--accent-fg);padding:3px 8px;border-radius:7px;flex:none}
.copy:hover{background:var(--accent-soft)}

.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl:last-child{border-bottom:0}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--tone,var(--muted));flex:none;margin-top:8px}
.tl .txt{flex:1}
.tl .when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tl .note{font-size:12.5px;color:var(--ink-2);margin-top:2px}

/* ---------- actions ---------- */
.acts{display:flex;flex-wrap:wrap;gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;
  font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);text-decoration:none;
  transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--line-2);background:#211D2D}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.btn.go{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 8px 22px -12px var(--glow)}
.btn.go:hover{background:var(--accent-hover)}
.btn.warn{color:var(--dead);border-color:color-mix(in srgb,var(--dead) 34%,transparent)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:11px;color:var(--ink);resize:vertical;min-height:62px;font-size:14px;outline:0}
label.fl{font-size:12.5px;color:var(--muted)}

/* ---------- overview ---------- */
.attention{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-top:14px}
.att{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:14px;text-align:start;border-inline-start:3px solid var(--tone,var(--muted));
  display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .12s}
.att:hover{border-color:var(--accent)}
.att:active{transform:scale(.99)}
.att b{font-family:var(--f-mono);font-size:25px;font-weight:600;color:var(--tone,var(--ink));
  font-variant-numeric:tabular-nums;line-height:1.2}
.att span{font-size:12.5px;color:var(--muted)}
.allclear{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:20px;text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
.allclear b{display:block;color:var(--done);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:15px;
  display:flex;flex-direction:column;gap:3px;text-align:start}
button.tile:hover{border-color:var(--accent)}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-family:var(--f-mono);display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--done)} .delta.down{color:var(--dead)} .delta.flat{color:var(--muted)}
.twocol{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:860px){.twocol{grid-template-columns:minmax(0,1fr)}}

/* seven-day bars: drawn from the daily rows, no library */
.chart{display:flex;align-items:flex-end;gap:6px;height:104px;padding-top:8px}
.daybar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:100%}
.daybar i{display:block;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:5px 5px 3px 3px;min-height:3px;transition:height .3s}
.daybar.today i{background:var(--accent)}
.daybar em{font-style:normal;font-size:10.5px;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.daybar b{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);text-align:center;font-variant-numeric:tabular-nums}

.toplist{display:flex;flex-direction:column;gap:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.top:last-child{border-bottom:0}
.top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sold{font-size:12px;color:var(--muted);font-family:var(--f-mono);flex:none}
.top .rev{font-family:var(--f-mono);font-weight:600;font-size:13.5px;flex:none}

/* ---------- products ---------- */
.plist{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.prow{display:flex;gap:12px;align-items:center;text-align:start;width:100%;
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px;
  transition:border-color .15s,transform .12s}
.prow:hover{border-color:var(--accent)}
.prow:active{transform:scale(.995)}
/* 3:4, the same ratio the shop uses, so what you see here is the crop
   the customer gets */
.pthumb{width:48px;aspect-ratio:3/4;border-radius:8px;flex:none;overflow:hidden;
  background:var(--bg);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:16px}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.prow .pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .meta,.meta{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}

/* ---------- editor ---------- */
.ed{display:flex;flex-direction:column;gap:8px}
.ed label{font-size:12.5px;color:var(--muted)}
.ed input,.ed select,.ed textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:10px;color:var(--ink);font-size:14px;outline:0}
.ed input:disabled{opacity:.55}
.ed input[type=checkbox]{width:auto}
.two{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.three{display:grid;gap:8px;grid-template-columns:1fr 1fr auto}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.rep{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:11px;display:flex;flex-direction:column;gap:8px}
.rep .hd{display:flex;align-items:center;gap:8px}
.rep .hd b{flex:1;font-size:13px}
.del{font-size:12px;color:var(--dead);padding:4px 9px;border-radius:8px;flex:none}
.del:hover{background:color-mix(in srgb,var(--dead) 14%,transparent)}
.addrow{border:1px dashed var(--line-2);border-radius:12px;padding:11px;width:100%;
  color:var(--accent-fg);font-size:13.5px;font-weight:600;transition:border-color .15s}
.addrow:hover{border-color:var(--accent);background:var(--accent-soft)}
.inactive{opacity:.6}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0}
.drop{border:1px dashed var(--line-2);border-radius:12px;padding:16px;text-align:center;
  cursor:pointer;display:block;transition:border-color .15s}
.drop:hover{border-color:var(--accent)}
.drop b{display:block;font-size:13.5px;margin-bottom:3px}
.drop span{font-size:12px;color:var(--muted)}
.posterprev{width:96px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;flex:none;background:var(--surface-2)}
.posterprev img{width:100%;height:100%;object-fit:cover;display:block}
.iconprev{width:72px;height:72px;border-radius:50%;overflow:hidden;flex:none;
  background:#fff;border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:26px;color:#6F6A80}
.iconprev img{width:76%;height:76%;object-fit:contain;display:block}
.lnk{color:var(--accent-fg);font-size:12px;text-decoration:underline;padding:0}
.noicon{font-size:11px;font-weight:600;color:var(--wait);flex:none;
  border:1px solid color-mix(in srgb,var(--wait) 40%,transparent);border-radius:999px;padding:2px 8px}
.notice{background:color-mix(in srgb,var(--wait) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--wait) 34%,transparent);
  border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.7;margin:0}
.notice b{display:block;font-size:13.5px;margin-bottom:3px}
.notice .who{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-word}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
  padding:14px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;flex-wrap:wrap;z-index:5}

/* ---------- site texts ---------- */
.tgrp{font-size:15px;margin:22px 2px 8px;color:var(--accent-fg)}
.trow{margin-top:8px;padding:12px 14px;gap:6px}
.trow.edited{border-inline-start:3px solid var(--accent)}
.trh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.tcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:900px){.tcols{grid-template-columns:minmax(0,1fr)}}
.tcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.tcell span{font-size:11.5px;color:var(--muted)}
.tcell textarea{min-height:40px;resize:vertical;font-size:13.5px;line-height:1.55;padding:8px 10px}
.tcell textarea.dirty{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcell textarea.bad{border-color:var(--dead);box-shadow:0 0 0 3px color-mix(in srgb,var(--dead) 25%,transparent)}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:9px;
  margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--accent);
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.savebar span{flex:1;font-weight:600;font-size:13.5px}

/* ---------- bot stock ---------- */
.vtable{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1.6fr) auto;gap:10px 14px;align-items:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
@media(max-width:760px){.vrow{grid-template-columns:minmax(0,1fr)}.vrow .vn b{display:inline;margin-inline-end:6px}}
.vrow .vn b{display:block;font-size:14px}
.vrow .vn span{font-size:12px;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.cnt-av{--tone:var(--done)} .cnt-rs{--tone:var(--wait)} .cnt-sd{--tone:var(--work)} .cnt-ds{--tone:var(--muted)}
.prices{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prices label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.prices input{width:96px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 8px;
  font-family:var(--f-mono);direction:ltr;outline:0}
.prices input:focus{border-color:var(--accent)}
.vacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.panel-in{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
.codes{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:340px;overflow:auto}
.code{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.code .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tagx{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent-fg);font-size:12.5px;font-weight:600}
.tagx button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.tagx button:hover{background:rgba(255,255,255,.08);color:var(--dead)}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inl input,.inl select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;outline:0;min-width:0}
.inl input:focus,.inl select:focus{border-color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.switch input{width:auto}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 10px}
.linkbox .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.more{margin-top:12px;width:100%}

/* ---------- login ---------- */
.login{max-width:380px;margin:12vh auto;padding:0 16px;display:flex;flex-direction:column;gap:16px}
.login .logo{width:52px;height:52px;font-size:24px}
.login h1{font-size:24px;margin:0}
.login p{color:var(--muted);font-size:13.5px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);outline:0}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--dead);font-size:13.5px;min-height:20px}

#toast{position:fixed;inset-block-end:18px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);
  background:var(--ink);color:var(--bg);border-radius:12px;font-weight:600;
  padding:10px 16px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;
  max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(50%) translateY(0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script type="module">
/* ============================================================
   No dependencies, same as js/janeiro-api.js: plain fetch against
   PostgREST, GoTrue and Storage. The service role key is never here --
   this page holds a normal user session, and every privileged action
   goes through admin_update_order_status, which checks is_admin()
   server-side. Losing this page's token exposes nothing an admin's
   own login would not.
   ============================================================ */
const CFG = {
  SUPABASE_URL: "__SUPABASE_URL__",
  SUPABASE_ANON_KEY: "__SUPABASE_ANON_KEY__",
  ...(window.JANEIRO_CONFIG || {}),
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* Session in sessionStorage, not localStorage: closing the tab ends the
   shift. An admin console left signed in on a shared phone is a risk. */
const SESSION_KEY = "janeiro_admin_session";
let session = null;
try { session = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch { session = null; }

const authHeaders = () => ({
  apikey: CFG.SUPABASE_ANON_KEY,
  Authorization: `Bearer ${session?.access_token ?? CFG.SUPABASE_ANON_KEY}`,
  "Content-Type": "application/json",
});

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600);
}

async function api(path, opts = {}) {
  const r = await fetch(`${CFG.SUPABASE_URL}${path}`, { ...opts, headers: authHeaders() });
  const text = await r.text();
  let body = null; try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!r.ok) {
    /* An expired session must send you back to the login screen rather
       than showing an unexplained failure on every row. */
    if (r.status === 401) { signOut(); throw new Error("انتهت الجلسة. سجّل الدخول من جديد."); }
    const msg = (body && (body.message || body.error_description || body.error)) || `خطأ ${r.status}`;
    throw new Error(String(msg));
  }
  return body;
}
const rest = (q) => api(`/rest/v1/${q}`);
const rpc  = (fn, args) => api(`/rest/v1/rpc/${fn}`, { method: "POST", body: JSON.stringify(args || {}) });

/* ---------------- auth ---------------- */
async function signIn(email, password) {
  const r = await fetch(`${CFG.SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error_description || d.msg || d.message || "تعذر تسجيل الدخول.");
  session = d;
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(d));
}

function signOut() {
  session = null;
  sessionStorage.removeItem(SESSION_KEY);
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
}

/* ---------------- status vocabulary ---------------- */
const STATUS = {
  awaiting_receipt:       ["بانتظار الوصل",   "t-wait"],
  pending_payment_review: ["مراجعة الدفع",    "t-wait"],
  payment_confirmed:      ["تم تأكيد الدفع",  "t-work"],
  activating:             ["جاري التفعيل",    "t-work"],
  needs_info:             ["نحتاج معلومات",   "t-wait"],
  completed:              ["مكتمل",           "t-done"],
  cancelled:              ["ملغي",            "t-dead"],
  refunded:               ["تم الاسترجاع",    "t-dead"],
};
const label = s => (STATUS[s] || [s, ""])[0];
const tone  = s => (STATUS[s] || ["", "t-wait"])[1];

/* The queue is ordered by what needs you first, not alphabetically. */
const QUEUE_ORDER = ["pending_payment_review","payment_confirmed","activating",
                     "needs_info","awaiting_receipt","completed","cancelled","refunded"];

const money = (n, c) => Math.round(Number(n) || 0).toLocaleString("en-US") + " " + (c || "دج");
const when  = t => new Date(t).toLocaleString("en-GB", { day:"2-digit", month:"2-digit",
                    year:"2-digit", hour:"2-digit", minute:"2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, m =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

/* ---------------- queue ---------------- */
/* ---------- overview ---------- */
/* Every figure here comes from admin_dashboard_stats(). Nothing is
   computed in the browser and nothing is estimated: if the database
   cannot answer it, it is not on this screen. */
const ATT_TONE = {
  pending_payment_review: "t-wait", needs_info: "t-wait",
  payment_confirmed: "t-work", activating: "t-work",
};

function delta(now, before) {
  const a = Number(now) || 0, b = Number(before) || 0;
  if (!b) return a ? `<span class="delta up">جديد</span>` : "";
  const pct = Math.round(((a - b) / b) * 100);
  if (pct === 0) return `<span class="delta flat">مثل أمس</span>`;
  return `<span class="delta ${pct > 0 ? "up" : "down"}" dir="ltr">${pct > 0 ? "+" : ""}${pct}%</span>`;
}

function chart(daily) {
  const max = Math.max(1, ...daily.map(d => Number(d.orders) || 0));
  /* The conventional Arabic weekday initials. Full names cannot fit
     seven across a phone, and clipping them mid-word reads as broken. */
  const names = ["ح","ن","ث","ر","خ","ج","س"];
  return `<div class="chart">${daily.map((d, i) => {
    const n = Number(d.orders) || 0;
    const day = new Date(d.day);
    const full = day.toLocaleDateString("ar", { weekday: "long" });
    return `<span class="daybar ${i === daily.length - 1 ? "today" : ""}">
      <b>${n || ""}</b>
      <i style="height:${Math.round((n / max) * 100)}%"></i>
      <em title="${full} — ${n} طلب">${names[day.getDay()]}</em>
    </span>`;
  }).join("")}</div>`;
}

async function loadOverview() {
  const st = await rpc("admin_dashboard_stats");
  const needs = st.needs_you || {};
  const waiting = Object.entries(needs).filter(([, n]) => n > 0);
  const hours = st.oldest_waiting_hours;

  $("#overview").innerHTML = `
    ${head("نظرة عامة", "الموقع والبوت في صفحة وحدة.")}
    <div class="card" style="margin-top:14px">
      <h2>يحتاجك الآن</h2>
      ${waiting.length ? `
        <div class="attention" style="margin-top:0">${waiting
          .sort((a, b) => QUEUE_ORDER.indexOf(a[0]) - QUEUE_ORDER.indexOf(b[0]))
          .map(([s, n]) => `<button class="att ${ATT_TONE[s] || "t-wait"}" data-goq="${s}">
              <b>${n}</b><span>${label(s)}</span></button>`).join("")}</div>
        ${hours != null && hours >= 12 ? `<p style="margin:0;font-size:13px;color:var(--wait)">
            أقدم طلب ينتظر المراجعة منذ ${hours} ساعة.</p>` : ""}`
        : `<div class="allclear" style="margin-top:0"><b>لا شيء ينتظرك</b>
             كل الطلبات في حالتها النهائية.</div>`}
    </div>

    <div class="card">
      <h2>اليوم</h2>
      <div class="tiles">
        <div class="tile"><span class="lbl">طلبات</span>
          <span class="v">${st.today.orders}</span>${delta(st.today.orders, st.yesterday.orders)}</div>
        <div class="tile"><span class="lbl">دخل مؤكَّد</span>
          <span class="v">${money(st.today.revenue)}</span>${delta(st.today.revenue, st.yesterday.revenue)}</div>
        <div class="tile"><span class="lbl">اكتمل</span>
          <span class="v">${st.today.completed}</span></div>
      </div>
      <p style="margin:0;font-size:12.5px;color:var(--muted)">
        الدخل يُحتسب من تأكيد الدفع، ويخرج منه المسترجع. الطلبات تحت المراجعة ليست دخلاً بعد.</p>
    </div>

    <div class="card">
      <h2>آخر سبعة أيام</h2>
      ${chart(st.daily || [])}
      <div class="tiles" style="margin-top:4px">
        <div class="tile"><span class="lbl">طلبات الأسبوع</span>
          <span class="v">${st.week.orders}</span></div>
        <div class="tile"><span class="lbl">دخل الأسبوع</span>
          <span class="v">${money(st.week.revenue)}</span></div>
      </div>
    </div>

    ${(st.top_products || []).length ? `
    <div class="card">
      <h2>الأكثر مبيعاً — 30 يوماً</h2>
      <div class="toplist">${st.top_products.map(t => `
        <div class="top">
          <span class="nm">${esc(t.name)}</span>
          <span class="sold">${t.sold}×</span>
          <span class="rev">${money(t.revenue)}</span>
        </div>`).join("")}</div>
    </div>` : ""}

    <div class="card">
      <h2>الإجمالي</h2>
      <div class="tiles">
        <div class="tile"><span class="lbl">طلبات</span>
          <span class="v">${st.totals.orders}</span></div>
        <div class="tile"><span class="lbl">عملاء</span>
          <span class="v">${st.totals.customers}</span></div>
        <div class="tile"><span class="lbl">دخل</span>
          <span class="v">${money(st.totals.revenue)}</span></div>
        ${Number(st.totals.refunded) > 0 ? `<div class="tile"><span class="lbl">مسترجع</span>
          <span class="v" style="color:var(--dead)">${money(st.totals.refunded)}</span></div>` : ""}
      </div>
    </div>`;

  /* the attention tiles are the fast path into the work */
  $$("[data-goq]").forEach(b => b.onclick = () => { filter = b.dataset.goq; showView("queue"); });

  /* the bot's side of the business, below the site's */
  $("#overview").insertAdjacentHTML("beforeend", await botOverviewCard());
  wireGo($("#overview"));
}

/* ---------- products ---------- */
/* The catalogue spans five tables. The editor holds one draft object in
   memory and sends it to admin_upsert_product, which writes all five in
   one transaction -- so a failed save leaves nothing half-built. */
const STATUS_LABEL = {
  published: "معروض للبيع", coming_soon: "قريباً", temporarily_unavailable: "غير متوفر مؤقتاً",
  draft: "مسودة", hidden: "مخفي", archived: "مؤرشف",
};
const WARRANTY_LABEL = {
  none: "بلا ضمان", activation: "ضمان التفعيل", days: "بعدد أيام",
  subscription_duration: "طوال مدة الاشتراك", custom: "نص مخصص",
};
/* نوع التفعيل: the values the owner picks from, read from the one file
   both apps share. The pair below is the floor under it, used when the
   file is missing, empty or full of blanks -- an empty dropdown would
   leave the owner unable to set the field at all. */
const ACT_TYPE_FALLBACK = ["تفعيل مباشر", "تفعيل عبر دعوة/رابط"];
function activationTypes() {
  const list = Array.isArray(window.JANEIRO_ACTIVATION_TYPES) ? window.JANEIRO_ACTIVATION_TYPES : [];
  const clean = list.map(t => String(t ?? "").trim()).filter(t => t && t.length <= 40);
  return clean.length ? clean : ACT_TYPE_FALLBACK;
}

const FIELD_LABEL = {
  email: "بريد إلكتروني", phone: "هاتف", username: "اسم مستخدم",
  text: "نص", number: "رقم", account_id: "معرّف حساب", custom: "مخصص",
};
let PRODUCTS = [], CATS = [], draft = null;

const money0 = n => Math.round(Number(n) || 0).toLocaleString("en-US");
const posterUrl = path =>
  path ? `${CFG.SUPABASE_URL}/storage/v1/object/public/product-media/${path}` : null;

/* ================================================================
   الباقات

   A bundle is several products for one price the owner types. The
   price is never derived here: it is entered, saved to the database,
   and create_order reads it back at checkout. The list total shown
   beside it is what the chosen plans cost separately, computed by
   admin_list_bundles, so the owner can see the saving they are about
   to offer before saving it.
   ================================================================ */
let BUNDLES = [], bundleDraft = null;

async function loadBundles() {
  [BUNDLES, PRODUCTS] = await Promise.all([
    rpc("admin_list_bundles"),
    rpc("admin_list_products"),
  ]);

  $("#bundles").innerHTML = `
    <div class="card" style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h2 style="flex:1">الباقات <span class="meta">(${BUNDLES.length})</span></h2>
        <button class="btn go" id="newBundle">+ باقة جديدة</button>
      </div>
      <p class="hint">عدة منتجات بسعر واحد أقل من مجموعها. السعر تكتبه أنت، ولا يُحسب كنسبة.</p>
      ${BUNDLES.length ? "" : `<div class="notice"><b>لا توجد باقات بعد</b>
        أنشئ باقة من زر «باقة جديدة»، أو من الملف <code>docs/bundles.sql</code>.</div>`}
      <div class="plist">${BUNDLES.map(b => {
        const saving = Number(b.list_total) - Number(b.bundle_price);
        const pct = Number(b.list_total) > 0 ? Math.round(saving / Number(b.list_total) * 100) : 0;
        /* Why a bundle is not on the storefront, said plainly rather
           than left to be discovered by looking at the site. */
        const why = !b.is_active ? "موقوفة"
                  : !b.sellable  ? "لا تُعرض — أحد منتجاتها غير منشور"
                  : "";
        return `<button class="prow" data-bundle="${esc(b.id)}">
          <span class="pi">
            <b>${esc(b.name)} ${why ? `<span class="meta">· ${esc(why)}</span>` : ""}</b>
            <span class="meta">${(b.items || []).map(i => esc(i.product_name)).join(" · ") || "بلا منتجات"}</span>
          </span>
          <span class="meta">${money0(b.bundle_price)} <s>${money0(b.list_total)}</s>
            ${saving > 0 ? `· وفّر ${pct}%` : ""}</span>
        </button>`;
      }).join("")}</div>
    </div>`;

  $("#newBundle").onclick = () => openBundleEditor(null);
  $$("#bundles .prow").forEach(b => b.onclick = () => openBundleEditor(b.dataset.bundle));
}

function blankBundle() {
  return { slug: "", name: "", short_description: "", bundle_price: "",
           is_active: false, sort_order: 0, items: [], __isNew: true };
}

function openBundleEditor(id) {
  const found = id ? BUNDLES.find(b => b.id === id) : null;
  bundleDraft = found ? JSON.parse(JSON.stringify(found)) : blankBundle();
  bundleDraft.__isNew = !found;
  bundleDraft.items = bundleDraft.items || [];
  $("#bundles").classList.add("hidden");
  $("#bundleEditor").classList.remove("hidden");
  renderBundleEditor();
}

function bundleListTotal(d) {
  return d.items.reduce((s, i) => s + Number(i.price || 0), 0);
}

/* Every active plan of every published product, as one flat list of
   choices. A bundle names a plan, not just a product, because the
   list total it is measured against depends on which plan. */
function planChoices() {
  const out = [];
  for (const p of PRODUCTS) {
    if (p.status !== "published") continue;
    for (const pl of (p.plans || [])) {
      if (pl.is_active === false) continue;
      out.push({ product_id: p.id, plan_id: pl.id, product_name: p.name,
                 plan_name: pl.name, price: Number(pl.price) });
    }
  }
  return out;
}

function renderBundleEditor() {
  const d = bundleDraft;
  const list = bundleListTotal(d);
  const price = Number(d.bundle_price || 0);
  const saving = list - price;
  const choices = planChoices();
  const taken = new Set(d.items.map(i => i.product_id));

  $("#bundleEditor").innerHTML = `
    <div class="chips"><button class="chip" id="bEdBack">→ رجوع للباقات</button></div>

    <div class="card">
      <h2>${d.__isNew ? "باقة جديدة" : esc(d.name)}</h2>
      <div class="ed">
        <input data-b="name" value="${esc(d.name || "")}" placeholder="اسم الباقة — مثال: باقة أدوات الذكاء الاصطناعي">
        <input data-b="slug" value="${esc(d.slug || "")}" ${d.__isNew ? "" : "disabled"}
               placeholder="المعرّف — حروف لاتينية صغيرة وشرطات، مثال: ai-tools">
        <input data-b="short_description" value="${esc(d.short_description || "")}"
               placeholder="وصف قصير — اختياري">
      </div>
    </div>

    <div class="card">
      <h2>المنتجات داخل الباقة</h2>
      <p class="hint">منتجان على الأقل. كل سطر يختار خطة بعينها، لأن سعر المنتج يختلف بين خطة وأخرى.</p>
      <div class="ed">${d.items.map((i, n) => `
        <div class="rep">
          <div class="hd"><b>${esc(i.product_name || "")} — ${esc(i.plan_name || "")}</b>
            <button class="del" data-bdel="${n}">حذف</button></div>
          <span class="meta">${money0(i.price)}${
            i.published === false ? ' · <b style="color:var(--warn,#B42318)">غير منشور</b>' : ""}</span>
        </div>`).join("")}</div>

      <div class="ed" style="margin-top:10px"><select id="bAdd">
        <option value="">+ أضف منتجاً…</option>
        ${choices.filter(c => !taken.has(c.product_id)).map(c =>
          `<option value="${esc(c.product_id)}|${esc(c.plan_id)}">${esc(c.product_name)} — ${esc(c.plan_name)} · ${money0(c.price)}</option>`).join("")}
      </select></div>
    </div>

    <div class="card">
      <h2>السعر</h2>
      <p class="hint">اكتب سعر الباقة كاملاً. لا يُحسب كنسبة — أنت تقرّر كم تساوي المجموعة.</p>
      <div class="ed">
        <input data-b="bundle_price" type="number" inputmode="numeric" value="${d.bundle_price ?? ""}"
               placeholder="سعر الباقة">
        <div class="dl">
          <div><span>مجموع الخطط منفردة</span><b>${money0(list)}</b></div>
          <div><span>سعر الباقة</span><b>${price ? money0(price) : "—"}</b></div>
          <div><span>التوفير</span><b>${
            price && list ? `${money0(saving)} (${Math.round(saving / list * 100)}%)` : "—"}</b></div>
        </div>
        ${price && list && saving <= 0
          ? `<div class="notice"><b>هذا ليس توفيراً</b> سعر الباقة يجب أن يكون أقل من ${money0(list)}.</div>` : ""}
        ${d.items.length < 2
          ? `<div class="notice"><b>الباقة تحتاج منتجين على الأقل</b> أضف منتجاً آخر قبل عرضها.</div>` : ""}
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="bActive" style="width:auto" ${d.is_active ? "checked" : ""}>
          معروضة في المتجر
        </label>
      </div>
    </div>

    <div class="sticky">
      <button class="btn go" id="saveBundle">حفظ</button>
      ${d.__isNew ? "" : `<button class="btn warn" id="delBundle">حذف الباقة</button>`}
      <button class="btn" id="cancelBundle">إلغاء</button>
    </div>`;

  $("#bEdBack").onclick = $("#cancelBundle").onclick = backToBundles;
  $$("#bundleEditor [data-b]").forEach(el =>
    el.oninput = el.onchange = () => { d[el.dataset.b] = el.value; renderPriceOnly(); });
  $("#bActive").onchange = e => { d.is_active = e.target.checked; };
  $("#bAdd").onchange = e => {
    const [pid, plid] = e.target.value.split("|");
    if (!pid) return;
    const c = planChoices().find(x => x.product_id === pid && x.plan_id === plid);
    if (c) d.items.push({ ...c, published: true });
    renderBundleEditor();
  };
  $$("#bundleEditor [data-bdel]").forEach(b =>
    b.onclick = () => { d.items.splice(+b.dataset.bdel, 1); renderBundleEditor(); });
  $("#saveBundle").onclick = saveBundle;
  if ($("#delBundle")) $("#delBundle").onclick = deleteBundle;
}

/* The price panel is the only thing that changes as you type, and
   re-rendering the whole editor would take the caret with it. */
function renderPriceOnly() {
  const d = bundleDraft, list = bundleListTotal(d), price = Number(d.bundle_price || 0);
  const dl = $("#bundleEditor .dl");
  if (!dl) return;
  const saving = list - price;
  dl.innerHTML = `
    <div><span>مجموع الخطط منفردة</span><b>${money0(list)}</b></div>
    <div><span>سعر الباقة</span><b>${price ? money0(price) : "—"}</b></div>
    <div><span>التوفير</span><b>${
      price && list ? `${money0(saving)} (${Math.round(saving / list * 100)}%)` : "—"}</b></div>`;
}

function backToBundles() {
  bundleDraft = null;
  $("#bundleEditor").classList.add("hidden");
  $("#bundles").classList.remove("hidden");
  loadBundles().catch(e => toast(e.message));
}

async function saveBundle() {
  const d = bundleDraft, btn = $("#saveBundle");
  /* The same rules the database enforces, said here so the message
     names the field instead of arriving as a raised exception. */
  if (!String(d.name).trim()) return toast("اكتب اسم الباقة.");
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(String(d.slug).trim()))
    return toast("المعرّف: حروف لاتينية صغيرة وأرقام وشرطات فقط.");
  if (d.items.length < 2) return toast("الباقة تحتاج منتجين على الأقل.");
  if (!String(d.bundle_price).trim()) return toast("اكتب سعر الباقة.");
  if (d.is_active && Number(d.bundle_price) >= bundleListTotal(d))
    return toast(`سعر الباقة يجب أن يكون أقل من ${money0(bundleListTotal(d))}.`);

  btn.disabled = true; btn.textContent = "جارٍ الحفظ…";
  try {
    await rpc("admin_upsert_bundle", { p_payload: {
      slug: String(d.slug).trim(), name: d.name, short_description: d.short_description,
      bundle_price: d.bundle_price, is_active: !!d.is_active, sort_order: d.sort_order || 0,
      items: d.items.map(i => ({ product_id: i.product_id, plan_id: i.plan_id })),
    }});
    toast("حُفظت الباقة.");
    backToBundles();
  } catch (e) {
    toast(BUNDLE_ERRORS[String(e.message).split(":")[0].trim()] || e.message);
    btn.disabled = false; btn.textContent = "حفظ";
  }
}

async function deleteBundle() {
  if (!confirm("حذف هذه الباقة؟ الطلبات التي بيعت بها تبقى كما هي.")) return;
  try {
    await rpc("admin_delete_bundle", { p_id: bundleDraft.id });
    toast("حُذفت الباقة.");
    backToBundles();
  } catch (e) { toast(e.message); }
}

function wireEditor() {
  const d = draft;
  $("#edBack").onclick = $("#cancelProd").onclick = backToProducts;

  $$("#editor [data-f]").forEach(el => el.oninput = el.onchange = () => { d[el.dataset.f] = el.value; });
  $$("#editor [data-p]").forEach(el => el.oninput = el.onchange = () => {
    const pl = d.plans[+el.dataset.p];
    pl[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value;
  });
  $$("#editor [data-r]").forEach(el => el.oninput = el.onchange = () => {
    const r = d.requirements[+el.dataset.r];
    r[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value;
  });
  $$("#editor [data-ft]").forEach(el => el.oninput = () => { d.features[+el.dataset.ft] = el.value; });

  $$("#editor [data-add]").forEach(b => b.onclick = () => {
    const k = b.dataset.add;
    if (k === "plans") d.plans.push({ name: "", price: "", is_active: true });
    if (k === "features") d.features.push("");
    if (k === "requirements") d.requirements.push({ label: "", field_type: "text", is_required: true });
    renderEditor();
  });
  $$("#editor [data-del]").forEach(b => b.onclick = () => {
    d[b.dataset.del].splice(+b.dataset.i, 1);
    renderEditor();
  });

  $("#posterFile").onchange = e => uploadPoster(e.target.files?.[0]);
  $("#iconFile").onchange   = e => uploadIcon(e.target.files?.[0]);
  if ($("#iconClear")) $("#iconClear").onclick = () => { draft.icon_path = ""; renderEditor(); };
  $("#saveProd").onclick = saveProduct;
  if ($("#archProd")) $("#archProd").onclick = archiveProduct;
}

function backToProducts() {
  draft = null;
  $("#editor").classList.add("hidden");
  $("#products").classList.remove("hidden");
  loadProducts().catch(e => toast(e.message));
}

/* ---------- upload ----------

   file.type is whatever the OS guessed from the extension; a renamed
   .exe reports image/png happily. The project validates images by their
   magic bytes everywhere else, and this upload path was the one place
   still trusting the browser. It reads the header itself now.

   SVG is deliberately absent: it is XML with no signature to check, and
   an SVG served from a public bucket as image/svg+xml executes any
   script it carries when its object URL is opened. */
const MAGIC = [
  { ext: "png",  mime: "image/png",  bytes: [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A] },
  { ext: "jpg",  mime: "image/jpeg", bytes: [0xFF, 0xD8, 0xFF] },
  // WebP is a RIFF container: "RIFF" .... "WEBP" -- bytes 8-11 must match too
  { ext: "webp", mime: "image/webp", bytes: [0x52, 0x49, 0x46, 0x46],
    also: { at: 8, bytes: [0x57, 0x45, 0x42, 0x50] } },
];

async function sniff(file) {
  const head = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  const at = (o, b) => b.every((v, i) => head[o + i] === v);
  for (const m of MAGIC) {
    if (at(0, m.bytes) && (!m.also || at(m.also.at, m.also.bytes))) return m;
  }
  return null;
}

/* Natural dimensions, read by decoding the image rather than trusting a
   header field. Returns null if the bytes do not decode at all. */
function dimensions(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res({ w: img.naturalWidth, h: img.naturalHeight }); };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

async function putObject(path, file, mime) {
  const r = await fetch(
    `${CFG.SUPABASE_URL}/storage/v1/object/product-media/${path}?upsert=true`, {
      method: "POST",
      headers: { apikey: CFG.SUPABASE_ANON_KEY,
                 Authorization: `Bearer ${session?.access_token}`,
                 "x-upsert": "true", "Content-Type": mime },
      body: file,
    });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || `فشل الرفع (${r.status})`);
}

/* Uploads straight into the public product-media bucket. The storage
   policy already limits writes there to admins, so no extra endpoint. */
async function uploadPoster(file) {
  if (!file) return;
  if (!draft.slug) { toast("اكتب المعرّف (slug) أولاً — اسم الملف يعتمد عليه."); return; }
  if (file.size > 5 * 1024 * 1024) { toast("الصورة أكبر من 5 ميغابايت."); return; }

  const m = await sniff(file);
  if (!m) { toast("هذا الملف ليس PNG أو JPG أو WebP — فحصنا محتواه لا امتداده."); return; }

  const path = `products/${draft.slug}.${m.ext}`;
  $("#dropTxt").textContent = "جارٍ الرفع…";
  try {
    await putObject(path, file, m.mime);
    draft.poster_path = path;
    toast("رُفعت الصورة. لا تنسَ الحفظ.");
    renderEditor();
  } catch (e) {
    toast(e.message);
    $("#dropTxt").textContent = "اختر صورة البوستر";
  }
}

/* The brand icon for the hero orbit. Stricter than the poster: it is
   rendered in a small round tile, so a non-square or low-resolution mark
   is visibly wrong rather than merely imperfect. The rules here mirror
   the CHECK constraint in migration 013 -- the path it builds is the only
   shape the column will accept, so a mistake here is refused on save
   rather than stored. */
const ICON_MIN = 128, ICON_IDEAL = 256, ICON_MAX = 1024;

async function uploadIcon(file) {
  if (!file) return;
  if (!draft.slug) { toast("اكتب المعرّف (slug) أولاً — اسم الملف يعتمد عليه."); return; }
  if (file.size > 1024 * 1024) { toast("الأيقونة أكبر من 1 ميغابايت — 256×256 لا تحتاج أكثر."); return; }

  const m = await sniff(file);
  if (!m) { toast("هذا الملف ليس PNG أو WebP — فحصنا محتواه لا امتداده."); return; }
  if (m.ext === "jpg") {
    toast("JPG بلا شفافية، وستظهر خلفية بيضاء داخل الدائرة. استعمل PNG أو WebP.");
    return;
  }

  const dim = await dimensions(file);
  if (!dim) { toast("تعذّرت قراءة الصورة — الملف تالف على الأرجح."); return; }
  if (dim.w !== dim.h) {
    toast(`الأيقونة يجب أن تكون مربّعة — هذه ${dim.w}×${dim.h}.`); return;
  }
  if (dim.w < ICON_MIN) {
    toast(`الأيقونة صغيرة (${dim.w}px). الحد الأدنى ${ICON_MIN}px والموصى به ${ICON_IDEAL}px.`); return;
  }
  if (dim.w > ICON_MAX) {
    toast(`الأيقونة كبيرة (${dim.w}px). الموصى به ${ICON_IDEAL}px.`); return;
  }

  const path = `products/icons/${draft.slug}.${m.ext}`;
  $("#iconTxt").textContent = "جارٍ الرفع…";
  try {
    await putObject(path, file, m.mime);
    draft.icon_path = path;
    toast(dim.w === ICON_IDEAL
      ? "رُفعت الأيقونة. لا تنسَ الحفظ."
      : `رُفعت الأيقونة (${dim.w}px). الموصى به ${ICON_IDEAL}px. لا تنسَ الحفظ.`);
    renderEditor();
  } catch (e) {
    toast(e.message);
    $("#iconTxt").textContent = "اختر أيقونة العلامة";
  }
}

async function saveProduct() {
  const d = draft;
  const btn = $("#saveProd");

  /* Mirror the server's rules here so the message names the field, and
     drop the empty rows the editor always leaves at the end. */
  if (!d.name.trim()) return toast("اكتب اسم المنتج.");
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(d.slug.trim()))
    return toast("المعرّف: حروف لاتينية صغيرة وأرقام وشرطات فقط.");

  const payload = {
    ...d,
    slug: d.slug.trim(),
    plans: d.plans.filter(p => String(p.name).trim() && String(p.price).trim() !== ""),
    features: d.features.map(f => String(f).trim()).filter(Boolean),
    requirements: d.requirements.filter(r => String(r.label).trim()),
  };
  delete payload.__isNew; delete payload.order_count;

  if (payload.status === "published" && !payload.plans.some(p => p.is_active !== false))
    return toast("منتج معروض للبيع يحتاج خطة نشطة واحدة على الأقل.");
  for (const p of payload.plans)
    if (p.old_price && Number(p.old_price) <= Number(p.price))
      return toast(`«${p.name}»: السعر قبل الخصم يجب أن يكون أكبر من السعر.`);

  btn.disabled = true; btn.textContent = "جارٍ الحفظ…";
  try {
    await rpc("admin_upsert_product", { p_payload: payload });
    toast("حُفظ المنتج.");
    backToProducts();
  } catch (e) {
    toast(PRODUCT_ERRORS[String(e.message).split(":")[0].trim()] || e.message);
    btn.disabled = false; btn.textContent = "حفظ";
  }
}

async function archiveProduct() {
  const d = draft;
  const used = d.order_count || 0;
  if (!confirm(used
    ? `«${d.name}» عليه ${used} طلب سابق. الأرشفة تخفيه من المتجر وتُبقي الطلبات كما هي. متابعة؟`

  } catch (e) { toast(e.message); }
}

}
function wireCopies(root) {

const searchBox = (id, ph, val) => `<label class="search"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden">${esc(ph)}</span>

/* type-to-search without a request per keystroke */
function onSearch(el, fn) {

}
const head = (title, sub, actions) => `<div class="pagehead"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div>${actions || ""}</div>`;

/* ---------------- warranty ---------------- */
const warrantyState = { tab: "site", q: "", status: "", offset: 0 };
const ENG_STATUS = {
  pending: ["بانتظار الزبون", "t-wait"], active: ["سارية", "t-done"],
  expired: ["منتهية", "t-muted"], revoked: ["ملغاة", "t-dead"],
};
async function loadWarranty() {
  const s = warrantyState;
  $("#warranty").innerHTML = head("وثائق الضمان", "ضمانات طلبات الموقع ووثائق الالتزام اللي يصنعها البوت، في بلاصة وحدة.") + `
    <div class="chips" role="group" aria-label="المصدر">
      <button class="chip" data-wt="site" aria-pressed="${s.tab === "site"}">طلبات الموقع</button>
      <button class="chip" data-wt="bot" aria-pressed="${s.tab === "bot"}">بوت التليغرام</button>
    </div>
    <div class="toolbar">${searchBox("wq", s.tab === "site" ? "الكود، رقم الطلب، الاسم ولا الهاتف" : "الكود، الاسم، الإنستغرام، الإيميل ولا الهاتف", s.q)}
      ${s.tab === "bot" ? `<select id="wst" aria-label="الحالة"><option value="">كل الحالات</option>${
        Object.entries(ENG_STATUS).map(([k, v]) => `<option value="${k}" ${s.status === k ? "selected" : ""}>${v[0]}</option>`).join("")}</select>` : ""}
    </div>
    <div class="rows" id="wrows"><div class="empty">…</div></div>
    <button class="btn more hidden" id="wmore">عرض المزيد</button>`;
  $$("[data-wt]").forEach(b => b.onclick = () => { s.tab = b.dataset.wt; s.q = ""; s.status = ""; s.offset = 0; loadWarranty(); });
  onSearch($("#wq"), q => { s.q = q; s.offset = 0; fillWarranty(); });
  if ($("#wst")) $("#wst").onchange = e => { s.status = e.target.value; s.offset = 0; fillWarranty(); };
  $("#wmore").onclick = () => { s.offset += 50; fillWarranty(true); };
  await fillWarranty();
}
async function fillWarranty(append) {
  const s = warrantyState, box = $("#wrows"), base = await siteBase();
  try {
    let res, html;
    if (s.tab === "site") {
      res = await rpc("admin_site_certificates", { p_query: s.q || null, p_limit: 50, p_offset: s.offset });
      html = res.rows.map(c => `<div class="row wrapme ${c.active ? "t-done" : "t-muted"}">
        <span class="main">
          <span class="num mono">${esc(c.code)} · #${esc(c.order_number)}</span>
          <span class="name">${esc(c.customer_name)} <span class="mono" style="font-size:12.5px;color:var(--muted)">${esc(c.customer_phone)}</span></span>
          <span class="sub">${esc(c.product_name)} — ${esc(c.plan_name)}${c.ends_at ? ` · حتى ${day(c.ends_at)}` : ""}</span>
        </span>
        <span class="side-acts">
          <span class="pill">${c.active ? "سارية" : "منتهية"}</span>
          ${base ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(base)}/?cert=${encodeURIComponent(c.code)}">فتح</a>` : ""}
          <button class="btn sm" data-copy="${esc(c.code)}">نسخ الكود</button>
        </span></div>`).join("");
    } else {
      res = await bot("engagements", { query: s.q || null, status: s.status || null, limit: 50, offset: s.offset });
      html = res.rows.map(c => {
        const st = ENG_STATUS[c.status] || [c.status, "t-muted"];
        return `<div class="row wrapme ${st[1]}">
        <span class="main">
          <span class="num mono">${esc(c.code)}${c.ref_code ? ` · ${esc(c.ref_code)}` : ""}</span>
          <span class="name">${esc(c.holder_name || "— مازال ما عمّرش —")}${c.whatsapp ? ` <span class="mono" style="font-size:12.5px;color:var(--muted)">${esc(c.whatsapp)}</span>` : ""}</span>
          <span class="sub">${esc(c.platform || "")}${c.instagram ? ` · @${esc(c.instagram)}` : ""}${c.email ? ` · ${esc(c.email)}` : ""}${
            c.payment_method ? ` · ${({ baridimob: "BaridiMob", ccp: "CCP", flexy: "Flexy" })[c.payment_method] || esc(c.payment_method)}` : ""}${c.ends_at ? ` · حتى ${day(c.ends_at)}` : ""}${
            c.days_left != null && c.status === "active" ? ` · بقات ${c.days_left} يوم` : ""} · ${esc(c.seller || "")}</span>
        </span>
        <span class="side-acts">
          <span class="pill">${c.ending_soon ? "تنتهي قريب" : st[0]}</span>
          ${base ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(base)}/warranty/${encodeURIComponent(c.code)}">الوثيقة</a>` : ""}
          ${c.status === "pending" ? `<button class="btn sm" data-relink="${esc(c.code)}">رابط للزبون</button>` : ""}
          ${c.status !== "revoked" ? `<button class="btn sm warn" data-revoke="${esc(c.code)}">إلغاء</button>` : ""}
        </span></div>`; }).join("");
    }
    if (!append) box.innerHTML = "";
    box.insertAdjacentHTML("beforeend", html || (append ? "" : `<div class="empty"><b>ما كاين والو</b>${s.q ? "جرّب بحث آخر." : "الوثائق تبان هنا كي تتصنع."}</div>`));
    $("#wmore").classList.toggle("hidden", s.offset + 50 >= res.total);
    wireCopies(box);
    box.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => {
      if (!confirm(`إلغاء الوثيقة ${b.dataset.revoke}؟ الزبون يشوفها ملغاة.`)) return;
      try { await bot("revoke", { code: b.dataset.revoke }); toast("أُلغيت الوثيقة."); s.offset = 0; fillWarranty(); } catch (e) { fail(e); }
    });
    box.querySelectorAll("[data-relink]").forEach(b => b.onclick = async () => {
      try {
        const r = await bot("relink", { code: b.dataset.relink, hours: 72 });
        const url = base ? `${base}/warranty/claim/${r.token}` : r.token;
        b.closest(".row").insertAdjacentHTML("afterend", `<div class="linkbox"><span class="mono">${esc(url)}</span>
          <button class="btn sm" data-copy="${esc(url)}">نسخ</button></div>`);
        wireCopies(box); b.remove(); copyText(url, "الرابط تنسخ — ابعثو للزبون. صالح 72 ساعة.");
      } catch (e) { fail(e); }
    });
  } catch (e) { box.innerHTML = `<div class="empty"><b>ما قدرناش نجيبو الوثائق</b>${esc(errText(e))}</div>`; }
}

async function loadCustomers() {
  $("#customers").innerHTML = head("الزبائن", "كل من طلب من الموقع، مجموعين بالرقم: شحال طلب وشحال خلّص.") + `
    <div class="toolbar">${searchBox("cq", "الاسم ولا رقم الهاتف", custState.q)}</div>
    <div class="rows" id="crows"><div class="empty">…</div></div>
    <button class="btn more hidden" id="cmore">عرض المزيد</button>`;
  onSearch($("#cq"), q => { custState.q = q; custState.offset = 0; fillCustomers(); });
  $("#cmore").onclick = () => { custState.offset += 50; fillCustomers(true); };
  await fillCustomers();
}
async function fillCustomers(append) {
  const box = $("#crows");
  try {
    const res = await rpc("admin_customers", { p_query: custState.q || null, p_limit: 50, p_offset: custState.offset });
    const html = res.rows.map(c => {
      const local = String(c.phone || "").replace(/^213/, "0");
      return `<div class="row wrapme t-work">
        <span class="main">
          <span class="name">${esc(c.name)}</span>
          <span class="sub"><span class="mono">${esc(local)}</span>${c.wilaya ? ` · ${esc(c.wilaya)}` : ""} · آخر طلب ${day(c.last_order_at)}</span>
        </span>
        <span class="side-acts">
          <span class="pill t-muted">${c.orders} طلب</span>
          <span class="money mono">${money(c.spent)}</span>
          <a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${esc(c.phone)}">واتساب</a>
          <button class="btn sm" data-copy="${esc(local)}">نسخ الرقم</button>
          <button class="btn sm" data-orders="${esc(c.phone)}">طلباتو</button>
        </span></div>`; }).join("");
    if (!append) box.innerHTML = "";
    box.insertAdjacentHTML("beforeend", html || (append ? "" : `<div class="empty"><b>ما كاين حتى زبون</b>${custState.q ? "جرّب بحث آخر." : "الزبائن يبانو هنا بعد أول طلب."}</div>`));
    $("#cmore").classList.toggle("hidden", custState.offset + 50 >= res.total);
    wireCopies(box);
    box.querySelectorAll("[data-orders]").forEach(b => b.onclick = async () => {
      const row = b.closest(".row");
      if (row.nextElementSibling?.classList.contains("rows")) { row.nextElementSibling.remove(); return; }
      try {
        const list = await rest("orders?select=id,order_number,status,total,currency,created_at" +
          `&normalized_phone=eq.${encodeURIComponent(b.dataset.orders)}&order=created_at.desc&limit=30`);
        row.insertAdjacentHTML("afterend", `<div class="rows" style="margin:0 0 6px;padding-inline-start:18px">${list.map(o => `
          <button class="row ${tone(o.status)}" data-oid="${o.id}">
            <span class="main"><span class="num mono">${esc(o.order_number)}</span><span class="sub">${when(o.created_at)}</span></span>
            <span class="money mono">${money(o.total, o.currency)}</span><span class="pill">${label(o.status)}</span>
          </button>`).join("")}</div>`);
        row.nextElementSibling.querySelectorAll("[data-oid]").forEach(x => x.onclick = () => openOrder(x.dataset.oid));
      } catch (e) { fail(e); }
    });
  } catch (e) { box.innerHTML = `<div class="empty"><b>ما قدرناش نجيبو الزبائن</b>${esc(errText(e))}</div>`; }
}

/* ---------------- bot: stock and codes ---------------- */
const UNIT = { day: "يوم", week: "أسبوع", month: "شهر", year: "سنة" };
let BOT_MARKETS = [], BOT_PLATFORMS = [];
async function loadStock() {
  const box = $("#stock");
  box.innerHTML = head("المخزون والأكواد", "منتجات البوت، مدّاتها، أسعارها لكل سوق، والأكواد اللي فيها.") + `<div class="empty">…</div>`;
  let cat;
  try {
    [cat, BOT_MARKETS, BOT_PLATFORMS] = await Promise.all([
      rpc("admin_bot_catalog"), bot("markets"), bot("platforms")]);
  } catch (e) {
    box.innerHTML = head("المخزون والأكواد") + `<div class="card"><div class="notice"><b>ما قدرناش نوصلو للبوت</b>${esc(errText(e))}</div></div>`;
    return;
  }
  const markets = BOT_MARKETS.filter(m => m.is_active);
  box.innerHTML = head("المخزون والأكواد", "منتجات البوت، مدّاتها، أسعارها لكل سوق، والأكواد اللي فيها.",
    `<button class="btn go" id="newBotProd">+ منتج جديد</button>`) + `
    <div class="card hidden" id="newProdCard">
      <h2>منتج جديد في البوت</h2>
      <div class="inl">
        <input id="npCode" placeholder="الكود (لاتيني) — مثلاً netflix" dir="ltr" style="flex:1 1 160px">
        <input id="npName" placeholder="الاسم — مثلاً نتفليكس" style="flex:2 1 200px">
        <button class="btn go" id="npSave">زيد</button>
      </div>
      <p class="hint">الكود يستعملو البوت في الأوامر، ما يتبدّلش من بعد.</p>
    </div>
    ${cat.length ? cat.map(p => productCard(p, markets)).join("") : `<div class="card"><div class="empty"><b>ما كاين حتى منتج في البوت</b>زيد أول منتج من الزر الفوق.</div></div>`}`;

  $("#newBotProd").onclick = () => $("#newProdCard").classList.toggle("hidden");
  $("#npSave").onclick = async () => {
    try { await bot("add_product", { code: $("#npCode").value.trim(), name: $("#npName").value.trim() }); toast("تزاد المنتج."); loadStock(); }
    catch (e) { fail(e); }
  };
  wireStock(box);
}
function productCard(p, markets) {
  const total = p.variants.reduce((s, v) => s + Number(v.available), 0);
  return `<div class="card ${p.is_active ? "" : "inactive"}" data-prod="${esc(p.product_id)}" data-pcode="${esc(p.code)}">
    <div class="cardhead">
      <h2>${esc(p.name)} <span class="meta">${esc(p.code)}</span></h2>
      <span class="pill ${total ? "t-done" : "t-dead"}">${total} متاح</span>
      <label class="switch"><input type="checkbox" data-pactive ${p.is_active ? "checked" : ""}> مفعّل</label>
    </div>
    <div class="vtable">${p.variants.map(v => `
      <div class="vrow ${v.is_active ? "" : "inactive"}" data-var="${esc(v.variant_id)}">
        <div class="vn"><b>${esc(v.name)} <span class="meta">${esc(v.code)}</span></b>
          <span>${v.duration_value ? `${v.duration_value} ${UNIT[v.duration_unit] || esc(v.duration_unit)}` : "بلا مدة — لازمة للوثيقة"}</span></div>
        <div class="counts">
          <span class="pill cnt-av">${v.available} متاح</span>
          ${Number(v.reserved) ? `<span class="pill cnt-rs">${v.reserved} محجوز</span>` : ""}
          <span class="pill cnt-sd">${v.sold} مباع</span>
          ${Number(v.disabled) ? `<span class="pill cnt-ds">${v.disabled} موقوف</span>` : ""}
        </div>
        <div class="prices">${markets.map(m => `<label>${esc(m.name)}
          <input type="number" inputmode="decimal" data-price="${esc(m.code)}" value="${v.prices?.[m.code] ?? ""}" placeholder="${esc(m.currency)}"></label>`).join("")}</div>
        <div class="vacts">
          <button class="btn sm go" data-vpanel="add">شحن أكواد</button>
          <button class="btn sm" data-vpanel="codes">الأكواد</button>
          <button class="btn sm" data-vpanel="dur">المدة</button>
          <button class="btn sm" data-vtoggle>${v.is_active ? "إيقاف" : "تفعيل"}</button>
        </div>
      </div>`).join("")}
      <div class="inl">
        <input data-nv="code" placeholder="كود المدة — y1" dir="ltr" style="flex:1 1 110px">
        <input data-nv="name" placeholder="اسم المدة — سنة" style="flex:2 1 160px">
        <button class="btn sm" data-addvar>+ مدة جديدة</button>
      </div>
    </div>
    <div class="twocol">
      <div class="ed"><label>المنصّات (تبان في وثيقة الضمان)</label>
        <div class="tags">${p.platforms.map(x => `<span class="tagx">${esc(x)}<button data-rmplat="${esc(x)}" aria-label="نحّي ${esc(x)}">×</button></span>`).join("") || `<span class="hint">ما كاين حتى منصّة.</span>`}
          <select data-addplat><option value="">+ زيد منصّة</option>${BOT_PLATFORMS.filter(x => !p.platforms.includes(x.name))
            .map(x => `<option>${esc(x.name)}</option>`).join("")}</select></div></div>
      <div class="ed"><label>معلومات يعمّرها الزبون</label>
        <div class="tags">${p.fields.map(f => `<span class="tagx">${esc(f.label)}${f.is_required ? "" : " (اختياري)"}<button data-rmfield="${esc(f.label)}" aria-label="نحّي">×</button></span>`).join("") || `<span class="hint">ما كاين حتى حقل.</span>`}</div>
        <div class="inl"><input data-nf placeholder="مثلاً البريد الإلكتروني" style="flex:1"><button class="btn sm" data-addfield>زيد</button></div></div>
    </div>
  </div>`;
}
function wireStock(box) {
  box.querySelectorAll("[data-prod]").forEach(card => {
    const pid = card.dataset.prod, pcode = card.dataset.pcode;
    card.querySelector("[data-pactive]").onchange = async e => {
      try { await bot("set_active", { kind: "product", id: pid, active: e.target.checked }); toast(e.target.checked ? "المنتج مفعّل." : "المنتج موقوف."); loadStock(); }
      catch (err) { fail(err); e.target.checked = !e.target.checked; }
    };
    card.querySelector("[data-addvar]").onclick = async () => {
      try {
        await bot("add_variant", { product_code: pcode, code: card.querySelector('[data-nv="code"]').value.trim(),
                                   name: card.querySelector('[data-nv="name"]').value.trim() });
        toast("تزادت المدة."); loadStock();
      } catch (e) { fail(e); }
    };
    const addPlat = card.querySelector("[data-addplat]");
    addPlat.onchange = async () => {
      if (!addPlat.value) return;
      try { await bot("add_product_platform", { product_id: pid, platform: addPlat.value }); loadStock(); } catch (e) { fail(e); }
    };
    card.querySelectorAll("[data-rmplat]").forEach(b => b.onclick = async () => {
      try { await bot("remove_product_platform", { product_id: pid, platform: b.dataset.rmplat }); loadStock(); } catch (e) { fail(e); }
    });
    card.querySelector("[data-addfield]").onclick = async () => {
      const label = card.querySelector("[data-nf]").value.trim();
      if (!label) return;
      try { await bot("add_field", { product_code: pcode, label, required: true }); loadStock(); } catch (e) { fail(e); }
    };
    card.querySelectorAll("[data-rmfield]").forEach(b => b.onclick = async () => {
      try { await bot("remove_field", { product_code: pcode, label: b.dataset.rmfield }); loadStock(); } catch (e) { fail(e); }
    });
  });

  box.querySelectorAll("[data-var]").forEach(row => {
    const vid = row.dataset.var;
    row.querySelectorAll("[data-price]").forEach(inp => inp.onchange = async () => {
      if (inp.value === "") return;
      try { await bot("set_price", { variant_id: vid, market: inp.dataset.price, price: Number(inp.value) }); toast("تحفظ السعر."); }
      catch (e) { fail(e); }
    });
    row.querySelector("[data-vtoggle]").onclick = async () => {
      const on = row.classList.contains("inactive");
      try { await bot("set_active", { kind: "variant", id: vid, active: on }); loadStock(); } catch (e) { fail(e); }
    };
    row.querySelectorAll("[data-vpanel]").forEach(b => b.onclick = () => variantPanel(row, vid, b.dataset.vpanel));
  });
}
async function variantPanel(row, vid, kind) {
  row.querySelector(".panel-in")?.remove();
  if (row.dataset.open === kind) { row.dataset.open = ""; return; }
  row.dataset.open = kind;
  const p = document.createElement("div");
  p.className = "panel-in";
  row.appendChild(p);
  if (kind === "add") {
    p.innerHTML = `<label class="fl">الأكواد — كل كود في سطر</label>
      <textarea rows="5" data-codes dir="ltr" placeholder="ABCD-1234&#10;EFGH-5678"></textarea>
      <div class="inl"><input data-note placeholder="ملاحظة (اختياري) — مثلاً رقم الفاتورة" style="flex:1">
        <button class="btn go" data-ship>شحن</button></div>
      <p class="hint">المكرّر (موجود من قبل) يتجاهل وحدو.</p>`;
    p.querySelector("[data-ship]").onclick = async () => {
      const codes = p.querySelector("[data-codes]").value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      if (!codes.length) return toast("اكتب كود واحد على الأقل.");
      try {
        const r = await bot("add_cards", { variant_id: vid, codes, note: p.querySelector("[data-note]").value.trim() || null });
        toast(`تزاد ${r.added}${r.duplicates ? ` · ${r.duplicates} مكرّر` : ""} · المتاح دركا ${r.available}`);
        loadStock();
      } catch (e) { fail(e); }
    };
  } else if (kind === "dur") {
    const cur = (row.querySelector(".vn span")?.textContent || "");
    p.innerHTML = `<div class="inl"><input type="number" min="1" data-dv placeholder="العدد" style="width:110px">
      <select data-du>${Object.entries(UNIT).map(([k, v]) => `<option value="${k}" ${k === "month" ? "selected" : ""}>${v}</option>`).join("")}</select>
      <button class="btn go sm" data-dsave>حفظ المدة</button><button class="btn sm" data-dclear>بلا مدة</button></div>
      <p class="hint">المدة تحسب تاريخ نهاية وثيقة الضمان. الحالية: ${esc(cur)}</p>`;
    const save = async (value, unit) => {
      try { await bot("set_duration", { variant_id: vid, value, unit }); toast("تحفظت المدة."); loadStock(); } catch (e) { fail(e); }
    };
    p.querySelector("[data-dsave]").onclick = () => save(p.querySelector("[data-dv]").value, p.querySelector("[data-du]").value);
    p.querySelector("[data-dclear]").onclick = () => save("", "");
  } else {
    p.innerHTML = `<div class="chips" style="padding-top:0" data-cst>
      ${[["", "الكل"], ["available", "متاح"], ["reserved", "محجوز"], ["sold", "مباع"], ["disabled", "موقوف"]]
        .map(([k, l]) => `<button class="chip" data-cs="${k}" aria-pressed="${k === ""}">${l}</button>`).join("")}</div>
      <div class="codes" data-list><div class="empty">…</div></div>`;
    const fill = async st => {
      const list = p.querySelector("[data-list]");
      try {
        const cards = await rpc("admin_bot_cards", { p_variant_id: vid, p_status: st || null, p_limit: 300 });
        list.innerHTML = cards.map(c => `<div class="code">
          <span class="pill ${c.status === "available" ? "cnt-av" : c.status === "reserved" ? "cnt-rs" : c.status === "sold" ? "cnt-sd" : "cnt-ds"}">${
            { available: "متاح", reserved: "محجوز", sold: "مباع", disabled: "موقوف" }[c.status] || c.status}</span>
          <span class="mono" title="${esc(c.code)}">${esc(c.code)}</span>
          <button class="copy" data-copy="${esc(c.code)}">نسخ</button>
          ${c.status === "available" ? `<button class="copy" data-dis="${c.id}">إيقاف</button>` : ""}
          ${c.status === "disabled" ? `<button class="copy" data-en="${c.id}">إرجاع</button>` : ""}
        </div>`).join("") || `<div class="empty" style="grid-column:1/-1;padding:20px">ما كاين حتى كود هنا.</div>`;
        wireCopies(list);
        list.querySelectorAll("[data-dis],[data-en]").forEach(b => b.onclick = async () => {
          try { await rpc("admin_bot_card_set", { p_card_id: b.dataset.dis || b.dataset.en, p_disabled: !!b.dataset.dis }); fill(st); }
          catch (e) { fail(e); }
        });
      } catch (e) { list.innerHTML = `<div class="empty">${esc(errText(e))}</div>`; }
    };
    p.querySelectorAll("[data-cs]").forEach(b => b.onclick = () => {
      p.querySelectorAll("[data-cs]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      fill(b.dataset.cs);
    });
    fill("");
  }
}

/* ---------------- bot: sales ---------------- */
const salesState = { status: "", seller: "", q: "", offset: 0 };
const SALE_STATUS = { pending: ["معلّقة", "t-wait"], confirmed: ["مؤكّدة", "t-done"], cancelled: ["ملغاة", "t-dead"] };
let SELLERS = [];
async function loadSales() {
  const s = salesState;
  try { SELLERS = await bot("sellers"); } catch (e) {
    $("#sales").innerHTML = head("مبيعات البوت") + `<div class="card"><div class="notice"><b>ما قدرناش نوصلو للبوت</b>${esc(errText(e))}</div></div>`;
    return;
  }
  $("#sales").innerHTML = head("مبيعات البوت", "كل بيعة دارها بائع من البوت: الكود، الزبون، السعر، والوثيقة.") + `
    <div class="chips" role="group" aria-label="الحالة">${[["", "الكل"], ...Object.entries(SALE_STATUS).map(([k, v]) => [k, v[0]])]
      .map(([k, l]) => `<button class="chip" data-ss="${k}" aria-pressed="${s.status === k}">${l}</button>`).join("")}</div>
    <div class="toolbar">${searchBox("sq", "الزبون، الكود ولا المنتج", s.q)}
      <select id="sseller" aria-label="البائع"><option value="">كل البائعين</option>${SELLERS.map(x =>
        `<option value="${x.telegram_id}" ${String(s.seller) === String(x.telegram_id) ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div class="rows" id="srows"><div class="empty">…</div></div>
    <button class="btn more hidden" id="smore">عرض المزيد</button>`;
  $$("[data-ss]").forEach(b => b.onclick = () => { s.status = b.dataset.ss; s.offset = 0; loadSales(); });
  onSearch($("#sq"), q => { s.q = q; s.offset = 0; fillSales(); });
  $("#sseller").onchange = e => { s.seller = e.target.value; s.offset = 0; fillSales(); };
  $("#smore").onclick = () => { s.offset += 50; fillSales(true); };
  await fillSales();
}
async function fillSales(append) {
  const s = salesState, box = $("#srows"), base = await siteBase();
  try {
    const res = await rpc("admin_bot_sales", { p_status: s.status || null, p_telegram_id: s.seller ? Number(s.seller) : null,
      p_query: s.q || null, p_limit: 50, p_offset: s.offset });
    const html = res.rows.map(r => {
      const st = SALE_STATUS[r.status] || [r.status, "t-muted"];
      return `<div class="row wrapme ${st[1]}" data-issue="${esc(r.issue_id)}" data-product="${esc(r.product_name)}">
        <span class="main">
          <span class="num mono">${esc(r.card_code)}</span>
          <span class="name">${esc(r.product_name)} — ${esc(r.variant_name)}</span>
          <span class="sub">${esc(r.customer_ref || "بلا زبون")} · ${esc(r.seller)} · ${when(r.requested_at)}${r.platform ? ` · ${esc(r.platform)}` : ""}</span>
        </span>
        <span class="side-acts">
          ${r.price != null ? `<span class="money mono">${money0(r.price)} ${esc(r.currency || "")}</span>` : ""}
          <span class="pill">${st[0]}</span>
          ${r.status === "pending" ? `<button class="btn sm go" data-confirm>تأكيد</button><button class="btn sm warn" data-cancel>إلغاء</button>` : ""}
          ${r.certificate_code ? (base ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(base)}/warranty/${encodeURIComponent(r.certificate_code)}">الوثيقة</a>` : `<span class="meta">${esc(r.certificate_code)}</span>`)
            : r.status === "confirmed" ? `<button class="btn sm" data-cert>وثيقة ضمان</button>` : ""}
          <button class="copy" data-copy="${esc(r.card_code)}">نسخ الكود</button>
        </span></div>`; }).join("");
    if (!append) box.innerHTML = "";
    box.insertAdjacentHTML("beforeend", html || (append ? "" : `<div class="empty"><b>ما كاين حتى بيعة</b>البيعات تبان هنا كي يبيع بائع من البوت.</div>`));
    $("#smore").classList.toggle("hidden", s.offset + 50 >= res.total);
    wireCopies(box);
    box.querySelectorAll("[data-issue]").forEach(row => {
      const id = row.dataset.issue;
      const act = async (action, msg) => {
        try { await bot(action, { issue_id: id }); toast(msg); s.offset = 0; fillSales(); refreshCounts(); } catch (e) { fail(e); }
      };
      row.querySelector("[data-confirm]")?.addEventListener("click", () => act("confirm_issue", "تأكّدت البيعة."));
      row.querySelector("[data-cancel]")?.addEventListener("click", () => {
        if (confirm("إلغاء البيعة؟ الكود يرجع للمخزون.")) act("cancel_issue", "تلغات البيعة والكود رجع للمخزون.");
      });
      row.querySelector("[data-cert]")?.addEventListener("click", () => certForm(row, id, base));
    });
  } catch (e) { box.innerHTML = `<div class="empty"><b>ما قدرناش نجيبو المبيعات</b>${esc(errText(e))}</div>`; }
}
/* a warranty for a bot sale: the platform first (the bot needs it), then
   a one-time link the customer opens to fill their own details */
async function certForm(row, issueId, base) {
  if (row.nextElementSibling?.dataset?.certform) { row.nextElementSibling.remove(); return; }
  let plats = [];
  try {
    const cat = await rpc("admin_bot_catalog");
    plats = (cat.find(p => p.name === row.dataset.product) || {}).platforms || [];
  } catch {}
  row.insertAdjacentHTML("afterend", `<div class="card" data-certform style="margin-top:0">
    <h3>وثيقة ضمان لهذه البيعة</h3>
    <div class="inl">
      <select data-plat><option value="">المنصّة…</option>${plats.map(x => `<option>${esc(x)}</option>`).join("")}</select>
      <input type="number" min="0" data-bonus placeholder="أيام زيادة (اختياري)" style="width:170px">
      <button class="btn go sm" data-make>اصنع رابط الزبون</button>
    </div>
    <p class="hint">${plats.length ? "الزبون يفتح الرابط ويعمّر اسمو ورقمو، والوثيقة تتصنع وحدها." : "هذا المنتج ما عندوش منصّات — زيدها من «المخزون والأكواد»."}</p>
  </div>`);
