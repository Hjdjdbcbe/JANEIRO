/* ---------------- store: every text on the site ----------------
   The storefront's wording lives in its I18N dictionary, three languages
   per key. That dictionary stays the source; site_texts (036) holds only
   the owner's edits, which the storefront lays over it at load. So this
   page reads the defaults from the live storefront itself -- never a
   copy that could drift -- and the edits from the table. */
const TEXT_GROUPS = {
  "header, menus, footer": "الرأس والقوائم والتذييل", "hero": "الواجهة الأولى", "shop + product cards": "المتجر وبطاقات المنتجات",
  "how it works": "كيفاش تطلب", "numbers": "الأرقام", "FAQ": "الأسئلة", "WhatsApp band": "شريط الواتساب",
  "cart": "السلة", "product page": "صفحة المنتج", "bundles (page kept, no longer in the menus)": "الباقات",
  "checkout": "إتمام الطلب", "order received": "الطلب وصل", "tracking": "تتبّع الطلب",
  "warranty certificate": "وثيقة الضمان", "about": "شكون حنا", "policies": "الشروط والسياسات",
  "server wording, rendered for FR/EN": "حالات الطلب (من السيرفر)", "loading + errors": "التحميل والأخطاء",
};
const TEXT_LANGS = [["ar", "العربية"], ["fr", "Français"], ["en", "English"]];
const textsState = { group: "", q: "", onlyEdited: false };
let TEXT_DEFAULTS = null;       // [{ key, group, ar, fr, en }]
let TEXT_SAVED = {};            // "key|lang" -> value (the owner's edits)

/* Reads the I18N object literal out of the storefront's source with a
   small scanner -- no eval. Keys look like  name: { ar:"…", fr:"…", en:"…" },
   and the dashed section comments above them ("---- hero ----") name the
   groups. */
function parseI18N(html) {
  const at = html.indexOf("const I18N = {");
  if (at < 0) throw new Error("ما لقيناش قاموس النصوص في صفحة الموقع.");
  const src = html.slice(at + "const I18N = {".length);
  const out = []; let group = "", i = 0, depth = 0, cur = null, key = null, pendingKey = null;
  const readString = () => {
    let j = i + 1, s = "";
    while (j < src.length && src[j] !== '"') { if (src[j] === "\\") { s += src[j] + src[j + 1]; j += 2; } else s += src[j++]; }
    i = j + 1; return JSON.parse('"' + s + '"');
  };
  while (i < src.length) {
    const ch = src[i];
    if (ch === "/" && src[i + 1] === "*") {
      const end = src.indexOf("*/", i + 2), body = src.slice(i + 2, end);
      const m = body.match(/^\s*-{3,}\s*(.+?)\s*-{3,}\s*$/);
      if (m && depth === 0) group = m[1];
      i = end + 2; continue;
    }
    if (ch === "/" && src[i + 1] === "/") { i = src.indexOf("\n", i); continue; }
    if (ch === '"') { const v = readString(); if (cur && key) { cur[key] = v; key = null; } continue; }
    if (ch === "{") { depth++; if (depth === 1) cur = { key: pendingKey, group }; i++; continue; }
    if (ch === "}") {
      if (depth === 0) break;                 // the end of I18N itself
      depth--; if (depth === 0 && cur) { out.push(cur); cur = null; } i++; continue;
    }
    const m = /^[A-Za-z_][A-Za-z0-9_]*(?=\s*:)/.exec(src.slice(i, i + 80));
    if (m) { if (depth === 0) pendingKey = m[0]; else key = m[0]; i += m[0].length; continue; }
    i++;
  }
  return out.filter(e => e.key && typeof e.ar === "string");
}

const tokensOf = s => (String(s || "").match(/\{[a-z_]+\}/g) || []).sort().join(",");

async function loadTexts() {
  const box = $("#texts");
  box.innerHTML = head("نصوص الموقع", "كل كتابة في الموقع، بثلاث لغات.") + `<div class="empty">…</div>`;
  try {
    if (!TEXT_DEFAULTS) {
      const r = await fetch(new URL("../", location.href), { cache: "no-store" });
      if (!r.ok) throw new Error(`ما قدرناش نقراو صفحة الموقع (${r.status}).`);
      TEXT_DEFAULTS = parseI18N(await r.text());
    }
    const rows = await rest("site_texts?select=key,lang,value");
    TEXT_SAVED = Object.fromEntries(rows.map(x => [`${x.key}|${x.lang}`, x.value]));
  } catch (e) {
    const missing = /site_texts|PGRST205|404/.test(String(e.message || e));
    box.innerHTML = head("نصوص الموقع") + `<div class="card"><div class="notice"><b>ما قدرناش نحمّلو النصوص</b>${
      missing ? "طبّق supabase/migrations/036_site_texts.sql في Supabase، ومن بعد ارجع هنا." : esc(errText(e))}</div></div>`;
    return;
  }
  const s = textsState, groups = [...new Set(TEXT_DEFAULTS.map(e => e.group))];
  const edited = new Set(Object.keys(TEXT_SAVED).map(k => k.split("|")[0]));
  box.innerHTML = head("نصوص الموقع",
      `كل كتابة في الموقع بثلاث لغات — ${TEXT_DEFAULTS.length} نص. بدّل واش تحب واضغط «حفظ». خانة فارغة ترجع للنص الأصلي.`,
      `<a class="btn sm" id="txView" target="_blank" rel="noopener">شوف الموقع ↗</a>`) + `
    <div class="toolbar">${searchBox("tq", "قلّب في النصوص — كلمة ولا اسم المفتاح", s.q)}
      <select id="tgroup" aria-label="القسم"><option value="">كل الأقسام</option>${groups.map(g =>
        `<option value="${esc(g)}" ${s.group === g ? "selected" : ""}>${esc(TEXT_GROUPS[g] || g)}</option>`).join("")}</select>
      <label class="switch"><input type="checkbox" id="tedited" ${s.onlyEdited ? "checked" : ""}> المبدّلة برك (${edited.size})</label>
    </div>
    <p class="hint">الكلمات بين { } مثل <span class="mono">{n}</span> يعمّرها الموقع وحدو (عدد، اسم...) — خلّيها كيما راهي.</p>
    <div id="tlist"></div>
    <div class="savebar hidden" id="tbar"><span id="tbarN"></span>
      <button class="btn" id="tUndo">تراجع</button><button class="btn go" id="tSave">حفظ</button></div>`;
  siteBase().then(b => { const a = $("#txView"); if (b) a.href = b; else a.href = new URL("../", location.href).href; });
  onSearch($("#tq"), q => { s.q = q; fillTexts(); });
  $("#tgroup").onchange = e => { s.group = e.target.value; fillTexts(); };
  $("#tedited").onchange = e => { s.onlyEdited = e.target.checked; fillTexts(); };
  $("#tUndo").onclick = () => fillTexts();
  $("#tSave").onclick = saveTexts;
  fillTexts();
}

function fillTexts() {
  const s = textsState, q = s.q.toLowerCase();
  const list = TEXT_DEFAULTS.filter(e =>
    (!s.group || e.group === s.group) &&
    (!s.onlyEdited || TEXT_LANGS.some(([l]) => `${e.key}|${l}` in TEXT_SAVED)) &&
    (!q || e.key.includes(q) || TEXT_LANGS.some(([l]) =>
      String(TEXT_SAVED[`${e.key}|${l}`] ?? e[l] ?? "").toLowerCase().includes(q))));
  const shown = list.slice(0, 120);
  let lastGroup = null;
  $("#tlist").innerHTML = shown.map(e => {
    const gh = !s.group && e.group !== lastGroup ? `<h3 class="tgrp">${esc(TEXT_GROUPS[e.group] || e.group)}</h3>` : "";
    lastGroup = e.group;
    const isEdited = TEXT_LANGS.some(([l]) => `${e.key}|${l}` in TEXT_SAVED);
    return gh + `<div class="card trow ${isEdited ? "edited" : ""}" data-tkey="${esc(e.key)}">
      <div class="trh"><span class="mono meta">${esc(e.key)}</span>
        ${isEdited ? `<span class="pill t-work">مبدّل</span><button class="copy" data-treset>رجّع الأصل</button>` : ""}</div>
      <div class="tcols">${TEXT_LANGS.map(([l, name]) => {
        const def = e[l] ?? "", cur = TEXT_SAVED[`${e.key}|${l}`] ?? def;
        return `<label class="tcell"><span>${name}${`${e.key}|${l}` in TEXT_SAVED ? " •" : ""}</span>
          <textarea rows="${Math.min(6, Math.max(1, Math.ceil(def.length / 52)))}" dir="${l === "ar" ? "rtl" : "ltr"}"
            data-tlang="${l}" data-def="${esc(def)}" data-cur="${esc(cur)}" placeholder="${esc(def)}">${esc(cur)}</textarea></label>`;
      }).join("")}</div>
    </div>`;
  }).join("") + (list.length > shown.length
      ? `<p class="hint" style="text-align:center">يبانو ${shown.length} من ${list.length} — قلّب ولا اختار قسم باش تلقى الباقي.</p>`
      : list.length ? "" : `<div class="empty"><b>ما كاين حتى نص</b>جرّب كلمة أخرى.</div>`);

  $$("#tlist textarea").forEach(ta => ta.oninput = () => { ta.classList.toggle("dirty", ta.value !== ta.dataset.cur); textsBar(); });
  $$("#tlist [data-treset]").forEach(b => b.onclick = () => {
    b.closest("[data-tkey]").querySelectorAll("textarea").forEach(ta => {
      ta.value = ta.dataset.def; ta.classList.toggle("dirty", ta.value !== ta.dataset.cur); });
    textsBar();
  });
  textsBar();
}

function textChanges() {
  return $$("#tlist textarea.dirty").map(ta => ({
    ta, key: ta.closest("[data-tkey]").dataset.tkey, lang: ta.dataset.tlang,
    /* typing the original back is the same as clearing it: no row */
    value: ta.value.trim() === ta.dataset.def.trim() ? "" : ta.value.trim(),
  }));
}
function textsBar() {
  const n = textChanges().length;
  $("#tbar").classList.toggle("hidden", !n);
  $("#tbarN").textContent = `${n} تعديل ما تحفظش`;
}
async function saveTexts() {
  const items = textChanges();
  /* a dropped {n} would print a raw "{n}" or lose the number on the site */
  const broken = items.filter(x => x.value && tokensOf(x.value) !== tokensOf(x.ta.dataset.def));
  $$("#tlist textarea.bad").forEach(t => t.classList.remove("bad"));
  if (broken.length) {
    broken.forEach(x => x.ta.classList.add("bad"));
    broken[0].ta.focus();
    return toast(`لازم تخلّي ${tokensOf(broken[0].ta.dataset.def) || "الكلمات بين { }"} كيما راهي في «${broken[0].key}».`);
  }
  try {
    const r = await rpc("admin_set_site_texts", { p_items: items.map(({ key, lang, value }) => ({ key, lang, value })) });
    toast(`تحفظ ${r.saved}${r.reset ? ` · رجع ${r.reset} للأصل` : ""}. الموقع يبدّل في التحميل الجاي.`);
    loadTexts();
  } catch (e) { fail(e); }
}

/* ---------- view switch ---------- */
let view = "overview";
const VIEWS = { overview: loadOverview, queue: loadQueue, products: loadProducts, bundles: loadBundles,
  deals: loadDeals, categories: loadCategories, customers: loadCustomers, warranty: loadWarranty,
  stock: loadStock, sales: loadSales, sellers: loadSellers, settings: loadSettings, texts: loadTexts };
const VIEW_IDS = Object.keys(VIEWS);
function showView(v) {
  view = v;
  for (const id of VIEW_IDS)
    $("#" + id).classList.toggle("hidden", id !== v);
  $("#detail").classList.add("hidden");
  $("#editor").classList.add("hidden");
  $("#bundleEditor").classList.add("hidden");
  $$("#tabs .tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.v === v)));
  window.scrollTo({ top: 0, behavior: "instant" });
  (VIEWS[v] || loadOverview)().catch(fail);
  refreshCounts();
}
/* ---------- queue ---------- */
let filter = "pending_payment_review";

async function loadQueue() {
  const counts = await rpc("admin_order_counts");
  $("#chips").innerHTML = QUEUE_ORDER
    .filter(s => counts[s] || s === filter)
    .map(s => `<button class="chip" data-s="${s}" aria-pressed="${s === filter}">
        ${label(s)} <span class="n">${counts[s] || 0}</span></button>`).join("")
    || `<span class="chip">لا طلبات بعد</span>`;

  $$("#chips .chip[data-s]").forEach(b => b.onclick = () => { filter = b.dataset.s; loadQueue(); });

  const rows = await rest(
    "orders?select=id,order_number,customer_name,customer_phone,status,total,currency,created_at" +
    `&status=eq.${filter}&order=created_at.desc&limit=100`);

  $("#rows").innerHTML = rows.length ? rows.map(o => `
    <button class="row ${tone(o.status)}" data-id="${o.id}">
      <span class="main">
        <span class="num mono">${esc(o.order_number)}</span>
        <span class="name">${esc(o.customer_name)}</span>
      </span>
      <span class="money mono">${money(o.total, o.currency)}</span>
      <span class="pill">${label(o.status)}</span>
    </button>`).join("")
    : `<div class="empty"><b>لا شيء هنا</b>لا طلبات في «${label(filter)}» حالياً.</div>`;

  $$("#rows .row").forEach(b => b.onclick = () => openOrder(b.dataset.id));
}

/* ---------------- one order ---------------- */
let SITE_URL = null;
async function siteUrl() {
  if (SITE_URL === null) {
    const rows = await rest("store_settings?select=key,value");
    SITE_URL = rows.find(r => r.key === "site_url")?.value || "";
  }
  return SITE_URL;
}

async function openOrder(id) {
  const [o] = await rest(
    "orders?select=*,payment_methods(label,type)," +
    "order_items(product_name_snapshot,plan_name_snapshot,quantity,unit_price,total_price,activation_type," +
    "warranty_label_snapshot,order_activation_data(field_label,field_value)," +
    "warranty_certificates(certificate_code,starts_at,ends_at))," +
    "order_status_history(old_status,new_status,note,created_at)" +
    `&id=eq.${id}`);
  if (!o) return toast("لم نعثر على الطلب.");

  const site = await siteUrl();
  const next = await rest(`order_status_transitions?select=to_status&from_status=eq.${o.status}`);
  const history = (o.order_status_history || [])
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  $("#detailBody").innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <h2 class="mono">${esc(o.order_number)}</h2>
        <span class="pill ${tone(o.status)}">${label(o.status)}</span>
      </div>
      <dl class="kv">
        <dt>العميل</dt><dd>${esc(o.customer_name)}</dd>
        <dt>الهاتف</dt><dd><span class="mono">${esc(o.customer_phone)}</span>
          <button class="copy" data-copy="${esc(o.customer_phone)}">نسخ</button></dd>
        ${o.customer_wilaya ? `<dt>الولاية</dt><dd>${esc(o.customer_wilaya)}</dd>` : ""}
        <dt>الدفع</dt><dd>${esc(o.payment_methods?.label || "—")}</dd>
        ${o.payment_reference ? `<dt>رقم العملية</dt><dd><span class="mono">${esc(o.payment_reference)}</span></dd>` : ""}
        <dt>الإجمالي</dt><dd><b class="mono">${money(o.total, o.currency)}</b></dd>
        <dt>وقت الطلب</dt><dd><span class="mono">${when(o.submitted_at || o.created_at)}</span></dd>
        ${o.customer_note ? `<dt>رسالة العميل</dt><dd>${esc(o.customer_note)}</dd>` : ""}
      </dl>
      ${o.receipt_path
        ? `<button class="btn" id="receiptBtn">عرض وصل الدفع</button>`
        : `<p style="color:var(--muted);font-size:13.5px;margin:0">لا وصل مرفوع.</p>`}
    </div>

    <div class="card">
      <h2>ما يجب تفعيله</h2>
      ${(o.order_items || []).map(it => `
        <div class="item">
          <div class="top">
            <b>${esc(it.product_name_snapshot)}</b>
            <span class="mono">${money(it.total_price, o.currency)}</span>
          </div>
          <div class="plan">${esc(it.plan_name_snapshot)}${it.quantity > 1 ? ` × ${it.quantity}` : ""}${
            it.warranty_label_snapshot ? ` · ${esc(it.warranty_label_snapshot)}` : ""}</div>
          ${it.activation_type ? `<div class="act"><div class="r">
            <span>نوع التفعيل</span><b>${esc(it.activation_type)}</b>
          </div></div>` : ""}
          ${(it.order_activation_data || []).length ? `<div class="act">${
            it.order_activation_data.map(a => `<div class="r">
              <span>${esc(a.field_label)}</span>
              <b>${esc(a.field_value)}</b>
              <button class="copy" data-copy="${esc(a.field_value)}">نسخ</button>
            </div>`).join("")}</div>` : ""}
          ${(it.warranty_certificates || [])[0] && site ? `
            <a class="btn" style="margin-top:10px;display:inline-block" target="_blank" rel="noopener"
               href="${site}/?cert=${(it.warranty_certificates[0].certificate_code)}">عرض شهادة الضمان</a>
          ` : ""}
        </div>`).join("")}
    </div>

    <div class="card">
      <h2>الخطوة التالية</h2>
      ${next.length ? `
        <div class="field">
          <label class="fl" for="note">سبب / ملاحظة <span style="opacity:.7">— تُحفظ في سجل الطلب</span></label>
          <textarea id="note" maxlength="400" placeholder="مثال: الوصل مطابق للمبلغ"></textarea>
        </div>
        <div class="acts">${next.map(t => `
          <button class="btn ${["cancelled","refunded"].includes(t.to_status) ? "warn" : "go"}"
                  data-to="${t.to_status}">${label(t.to_status)}</button>`).join("")}</div>`
        : `<p style="color:var(--muted);font-size:13.5px;margin:0">هذا الطلب وصل حالته النهائية.</p>`}
    </div>

    <div class="card">
      <h2>السجل</h2>
      <div class="timeline">${history.map(h => `
        <div class="tl ${tone(h.new_status)}">
          <span class="dot"></span>
          <span class="txt">
            ${h.old_status ? `${esc(label(h.old_status))} ← ` : ""}<b>${esc(label(h.new_status))}</b>
            ${h.note ? `<div class="note">${esc(h.note)}</div>` : ""}
          </span>
          <span class="when">${when(h.created_at)}</span>
        </div>`).join("")}</div>
    </div>`;

  $$("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast("نُسخ"); }
    catch { toast("تعذر النسخ"); }
  });

  if (o.receipt_path) $("#receiptBtn").onclick = () => showReceipt(o.receipt_path);

  $$("[data-to]").forEach(b => b.onclick = async () => {
    const to = b.dataset.to;
    if (["cancelled","refunded"].includes(to) &&
        !confirm(`تأكيد النقل إلى «${label(to)}»؟ لا يمكن التراجع عن هذه الحالة.`)) return;
    $$("[data-to]").forEach(x => x.disabled = true);
    try {
      const res = await rpc("admin_update_order_status", {
        p_order_id: o.id, p_new_status: to, p_note: ($("#note")?.value || "").trim() || null,
      });
      toast(res.changed ? `صار «${label(res.status)}»` : "الحالة لم تتغيّر");
      await openOrder(o.id);
      await loadQueue();
    } catch (e) {
      toast(e.message);
      $$("[data-to]").forEach(x => x.disabled = false);
    }
  });

  for (const id of VIEW_IDS) $("#" + id).classList.add("hidden");
  $("#detail").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* The receipts bucket is private. A short-lived signed URL is minted on
   demand rather than making the bucket public. */
async function showReceipt(path) {
  try {
    const d = await api(`/storage/v1/object/sign/receipts/${path}`, {
      method: "POST", body: JSON.stringify({ expiresIn: 300 }),
    });
    const url = d.signedURL || d.signedUrl;
    if (!url) throw new Error("تعذر إنشاء رابط الوصل.");
    window.open(`${CFG.SUPABASE_URL}/storage/v1${url}`, "_blank", "noopener");
  } catch (e) { toast(e.message); }
}

/* ---------------- boot ---------------- */
function showApp(email) {
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#who").textContent = email || "";
  showView("overview");
}
$$("#tabs .tab").forEach(t => t.onclick = () => showView(t.dataset.v));

$("#loginBtn").onclick = async () => {
  const btn = $("#loginBtn");
  $("#loginErr").textContent = "";
  btn.disabled = true; btn.textContent = "جارٍ الدخول…";
  try {
    await signIn($("#email").value.trim(), $("#pass").value);
    /* Signing in is not the same as being an admin. The RPC refuses a
       non-admin anyway, but say so here rather than showing an empty
       console the person cannot use. */
    const counts = await rpc("admin_order_counts").catch(() => null);
    if (counts === null) {
      signOut();
      throw new Error("هذا الحساب ليس أدمن على هذا المتجر.");
    }
    $("#pass").value = "";
    showApp($("#email").value.trim());
  } catch (e) {
    $("#loginErr").textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "دخول";
  }
};
$("#pass").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#logout").onclick = signOut;
$("#refresh").onclick = () => showView(view);
$("#back").onclick = () => {
  $("#detail").classList.add("hidden");
  $("#queue").classList.remove("hidden");
  $$("#tabs .tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.v === "queue")));
  view = "queue";
  loadQueue().catch(e => toast(e.message));
};

/* the module scope is not global; the browser tests drive these */
Object.assign(window, { showView, loadOverview, loadQueue, loadProducts, openEditor,
  loadStock, loadSales, loadWarranty, loadCustomers, loadSettings, loadTexts, parseI18N });

if (session?.access_token) showApp(session?.user?.email);
</script>
